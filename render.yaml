services:
  # The PostgreSQL Database
  - type: pgo
    name: school-db
    databaseName: schooldb
    user: school_user
    plan: free

  # The Django Backend Web Service
  - type: web
    name: school-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py migrate"
    startCommand: "gunicorn backend.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: school-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-vercel-app-url.vercel.app" # You will update this after deploying frontend
